name: Group 3.3 history finalization

on:
  push:
    branches: ["main"]

permissions:
  contents: write

env:
  TELEGRAM_BOT_TOKEN: "123456:TEST_TOKEN"
  GOLDAPI_API_KEY: "test-goldapi-api-key"
  DATABASE_URL: "sqlite:///:memory:"
  WHOP_WEBHOOK_SECRET: "whsec_cGhhc2UyLXRlc3Qtc2VjcmV0"

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt && python -m pip install pytest
      - name: Patch History renderer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('main.py')
          s = p.read_text(encoding='utf-8')
          start = s.find('async def render_history(update: Update, context: ContextTypes.DEFAULT_TYPE) -> None:')
          end = s.find('\nasync def render_menu(update: Update, context: ContextTypes.DEFAULT_TYPE) -> None:', start)
          if start < 0 or end < 0:
              raise SystemExit('render_history block not found')
          new = '''async def render_history(update: Update, context: ContextTypes.DEFAULT_TYPE) -> None:\n    user = update.effective_user\n    if user is None:\n        return\n    lang = _lang(update)\n    active = _is_active(update)\n    rows = ["[ OPERATOR HUB ]"]\n    try:\n        orders = whop_storage.recent_orders_for(user.id, 5)\n    except Exception:\n        orders = []\n    if orders:\n        for order in orders:\n            order_id = _esc(str(order.get("id", "—"))[:20])\n            status = _esc(str(order.get("status", "—")).upper())\n            days = order.get("duration_days", "—")\n            rows.append(f"TRANSACTION : <code>{order_id}</code>")\n            rows.append(f"STATUS      : {status}")\n            rows.append(f"DURATION    : {days} days")\n            rows.append("")\n    else:\n        rows.append("—")\n    keyboard_rows = []\n    if not active:\n        keyboard_rows.append([InlineKeyboardButton(f"💎 {t(lang, 'activate_premium')}", callback_data="screen:activate")])\n    await _present(\n        update,\n        _screen(update, "\\n".join(rows).rstrip(), f">> {t(lang, 'history')} // {t(lang, 'account')}"),\n        _keyboard(update, keyboard_rows),\n    )\n'''
          p.write_text(s[:start] + new + s[end:], encoding='utf-8')

          # Permanent regression coverage for the History screen.
          test = Path('tests/test_group33_history.py')
          test.write_text('''import asyncio\nimport inspect\n\nimport main\n\n\ndef test_history_renderer_uses_screen_content_and_context_separator():\n    src = inspect.getsource(main.render_history)\n    assert "[ OPERATOR HUB ]" in src\n    assert "recent_orders_for" in src\n    assert "t(lang, \'history\')} // {t(lang, \'account\')}" in src\n    assert "t(lang, \'history\')}\\\"," not in src\n\n\ndef test_history_renderer_has_inactive_premium_cta_and_persistent_nav():\n    src = inspect.getsource(main.render_history)\n    assert "screen:activate" in src\n    assert "_keyboard(update, keyboard_rows)" in src\n\n\ndef test_history_renderer_is_async():\n    assert asyncio.iscoroutinefunction(main.render_history)\n''', encoding='utf-8')

          # Restore validation workflow to read-only and remove all temporary writers.
          ci = Path('.github/workflows/phase2-ci.yml')
          cs = ci.read_text(encoding='utf-8')
          cs = cs.replace('permissions:\n  contents: write', 'permissions:\n  contents: read', 1)
          ci.write_text(cs, encoding='utf-8')
          for path in Path('.github/workflows').glob('*history_fix*.yml'):
              if path.name != 'history_fix_cleanup.yml':
                  path.unlink()
          PY
      - name: Validate final source
        run: |
          python -m compileall -q .
          python scripts/check_ui_hardcoded_strings.py
          python -m pytest -q
          python -m unittest discover -s tests -p 'test_*.py' -q
          grep -Fq 'DEFAULT_MAX_WIDTH = 70' terminal_style.py
          grep -Fq 'return None' premium_visuals.py
          grep -Fq "t(lang, 'history')} // {t(lang, 'account')}" main.py
          if grep -Fq "f\">> {t(lang, 'history')}\"" main.py; then exit 1; fi
      - name: Commit final history fix
        shell: bash
        run: |
          rm -f .github/workflows/history_fix_cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py tests/test_group33_history.py .github/workflows/phase2-ci.yml .github/workflows/*history_fix*.yml
          git commit -m 'Group 3.3: fix transaction history screen'
          git push origin HEAD:main
