name: Group 3.3 menu row cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove empty keyboard row
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('main.py')
          s = p.read_text(encoding='utf-8')
          old = "rows = [[InlineKeyboardButton(f'❓ {t(lang, 'help')}', callback_data='screen:help')], [InlineKeyboardButton(f'🌐 {t(lang, 'support')}', callback_data='screen:support')], []]"
          new = "rows = [[InlineKeyboardButton(f'❓ {t(lang, 'help')}', callback_data='screen:help')], [InlineKeyboardButton(f'🌐 {t(lang, 'support')}', callback_data='screen:support')]]"
          if old not in s:
              raise SystemExit('target menu row not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python -m compileall -q main.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py
          git commit -m 'fix: remove empty Group 3.3 menu keyboard row'
          git push origin main
