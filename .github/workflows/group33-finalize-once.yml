name: Group 3.3 finalization
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  finalize:
    if: ${{ !startsWith(github.event.head_commit.message, 'Group 3.3: finalize') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply canonical render finalization
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('main.py')
          s = p.read_text(encoding='utf-8')

          home = '''def home_keyboard(update: Update) -> InlineKeyboardMarkup:
              lang = _lang(update)
              if update.effective_user and not auth.verify_token(update.effective_user.id)[0]:
                  import phase2_bot
                  telegram_id = update.effective_user.id
                  return _keyboard(update, [
                      [InlineKeyboardButton(f"🟢 {t(lang, 'days7')}", url=phase2_bot.checkout_link(telegram_id, 7))],
                      [InlineKeyboardButton(f"🟡 {t(lang, 'days14')}", url=phase2_bot.checkout_link(telegram_id, 14))],
                      [InlineKeyboardButton(f"🔵 {t(lang, 'days30')}", url=phase2_bot.checkout_link(telegram_id, 30))],
                  ])
              return _keyboard(update, [
                  [InlineKeyboardButton("MARKET PULSE", callback_data='screen:price'), InlineKeyboardButton("NEURAL STRIKES", callback_data='screen:signal')],
                  [InlineKeyboardButton("STRUCTURE MAP", callback_data='screen:analysis')],
              ])

          '''
          s, n = re.subn(r'def home_keyboard\(update: Update\) -> InlineKeyboardMarkup:\n.*?(?=def price_keyboard)', home, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('home_keyboard target not found')

          present = '''async def _present(update: Update, text: str, keyboard: InlineKeyboardMarkup, edit: bool=True) -> None:
              """Render every customer screen as Header -> Terminal -> optional Action -> Nav."""
              query = update.callback_query
              user = update.effective_user
              lang = _lang(update)
              plain = html.unescape(re.sub(r"<[^>]+>", "", text)).strip()
              is_home = "OPERATOR CONSOLE" in plain
              if user and is_home:
                  active, _ = auth.verify_token(user.id)
                  terminal = f"NEURAL GOLD v3.2 // OPERATOR CONSOLE\\n\\n{boot(granted=active)}"
                  action = f">> {t(lang, 'select_module')}" if active else f">> {t(lang, 'access')}"
              else:
                  body = re.sub(r"\[ \d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2} UTC \]", "", plain)
                  body = re.sub(r"(?im)^\\s*(OPERATOR|STATUS)\\s*:\\s*.*$", "", body)
                  body = re.sub(r"(?im)^\\s*TELEGRAM_ID\\s*:\\s*.*$", "", body)
                  body = body.translate(str.maketrans('', '', '┍┑┕┙│◤◥◣◢━'))
                  terminal = render_terminal_box(body.strip(), 40)
                  action = ""
              canonical = f"{render_header(user, lang)}\\n<pre>{render_terminal_box(terminal, 40)}</pre>" if user else f"<pre>{terminal}</pre>"
              if action:
                  canonical += f"\\n\\n{action}"
              if query and edit:
                  try:
                      await query.edit_message_text(text=canonical, parse_mode='HTML', reply_markup=keyboard)
                      return
                  except BadRequest as exc:
                      if 'not modified' in str(exc).lower():
                          return
                  except Exception as exc:
                      logger.debug('Could not edit callback message: %s', exc)
              try:
                  if query and query.message:
                      await query.message.reply_text(canonical, parse_mode='HTML', reply_markup=keyboard)
                      return
              except Exception as exc:
                  logger.debug('Callback reply fallback failed: %s', exc)
              if update.message:
                  await update.message.reply_text(canonical, parse_mode='HTML', reply_markup=keyboard)

          '''
          s, n = re.subn(r'async def _present\(update: Update, text: str, keyboard: InlineKeyboardMarkup, edit: bool=True\) -> None:\n.*?(?=async def start_command)', present, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('_present target not found')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Compile
        run: python -m compileall -q .
      - name: Regression
        run: python -m pytest -q
      - name: Full unittest
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Static UI guard
        run: python scripts/check_ui_hardcoded_strings.py
      - name: Commit canonical finalization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py
          git commit -m 'Group 3.3: finalize canonical render flow'
          git push origin main
