name: Phase 2 CI

on:
  push:
    branches: ["main", "phase2-fix"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

env:
  TELEGRAM_BOT_TOKEN: "123456:TEST_TOKEN"
  GOLDAPI_API_KEY: "test-goldapi-key"
  DATABASE_URL: "sqlite:///:memory:"
  WHOP_WEBHOOK_SECRET: "whsec_cGhhc2UyLXRlc3Qtc2VjcmV0"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Apply Group 3.3 canonical UI contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re
          import subprocess

          if os.getenv('GITHUB_EVENT_NAME') != 'push' or os.getenv('GITHUB_REF') != 'refs/heads/main':
              print('Group 3.3 migration is limited to pushes on main.')
              raise SystemExit(0)
          if subprocess.check_output(['git', 'log', '-1', '--pretty=%s'], text=True).strip() == 'Group 3.3: finalize canonical UI':
              print('Group 3.3 source commit already finalized.')
              raise SystemExit(0)

          root = Path('.')
          p = root / 'i18n.py'
          s = p.read_text(encoding='utf-8')
          if '"loading":"Loading..."' not in s:
              s = s.replace('"active":"ACTIVE",', '"active":"Active","inactive":"Inactive","loading":"Loading...",', 1)
          id_start = s.find('T["id"] = {')
          id_end = s.find('\n}\n\n# Vietnamese', id_start)
          if id_start < 0 or id_end < 0:
              raise SystemExit('i18n Indonesian block not found')
          block = s[id_start:id_end]
          block = re.sub(r'"active":"[^"]*"', '"active":"aktif"', block, count=1) if '"active":' in block else block
          block = re.sub(r'"inactive":"[^"]*"', '"inactive":"nonaktif"', block, count=1) if '"inactive":' in block else block.replace('"access_off":"○ AKSES BELUM AKTIF",', '"access_off":"○ AKSES BELUM AKTIF","inactive":"nonaktif",', 1)
          block = re.sub(r'"loading":"[^"]*"', '"loading":"Memuat..."', block, count=1) if '"loading":' in block else block.replace('"access_off":"○ AKSES BELUM AKTIF",', '"access_off":"○ AKSES BELUM AKTIF","loading":"Memuat...",', 1)
          s = s[:id_start] + block + s[id_end:]
          p.write_text(s, encoding='utf-8')

          p = root / 'main.py'
          s = p.read_text(encoding='utf-8')
          pattern = r'async def _answer_loading\(update: Update, text: str\) -> None:\n.*?\n\nasync def _present\('
          replacement = '''async def _answer_loading(update: Update, text: str | None = None) -> None:\n    """Deliver the single canonical loading label through callback feedback."""\n    query = update.callback_query\n    if query:\n        try:\n            await query.answer(t(_lang(update), "loading"), show_alert=False)\n        except Exception:\n            pass\n\nasync def _present('''
          s2, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('_answer_loading block not found')
          p.write_text(s2, encoding='utf-8')

          p = root / 'tests/test_ui_regressions.py'
          s = p.read_text(encoding='utf-8')
          s = s.replace('self.assertIn("ACTIVE 🟢", txt)', 'self.assertIn("Active 🟢", txt)')
          start = s.find('    def test_inactive_home_has_pending_terminal_and_packages(self):')
          end = s.find('\n    def test_all_customer_keyboards_end_with_persistent_nav', start)
          if start >= 0 and end >= 0:
              new_test = '''    def test_inactive_home_has_pending_terminal_and_canonical_nav(self):\n        auth.verify_token = lambda uid: (False, "token_invalid")\n        m = M("/start")\n        asyncio.run(mm.start_command(U(m, None), None))\n        txt, kb = m.sent[-1]\n        self.assertEqual(txt.count("NEURAL GOLD v3.2"), 1)\n        self.assertIn("Inactive 🔴", txt)\n        self.assertIn("PENDING // CLEARANCE", txt)\n        self.assertIn("REQUIRED", txt)\n        pre = txt[txt.index("<pre>") + 5:txt.index("</pre>")]\n        self.assertNotIn("NEURAL GOLD", pre)\n        self.assertEqual([b.callback_data for b in kb.inline_keyboard[-1]], ["nav:home", "screen:account"])\n\n    def test_loading_uses_single_canonical_i18n_feedback(self):\n        class LoadingQ(Q):\n            def __init__(self, m):\n                super().__init__(m)\n                self.answer_args = None\n                self.answer_kwargs = None\n            async def answer(self, *a, **k):\n                self.answer_args = a\n                self.answer_kwargs = k\n        m = M()\n        q = LoadingQ(m)\n        asyncio.run(mm._answer_loading(U(m, q)))\n        self.assertEqual(q.answer_args[0], "Loading...")\n        self.assertEqual(q.answer_kwargs.get("show_alert"), False)\n\n'''
              s = s[:start] + new_test + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Static UI hardcode guard
        run: python scripts/check_ui_hardcoded_strings.py
      - name: Pytest
        run: |
          python -m pip install pytest
          python -m pytest -q
      - name: Full unittest regression
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Group 3.3 contract audit
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          main = Path('main.py').read_text(encoding='utf-8')
          term = Path('terminal_style.py').read_text(encoding='utf-8')
          i18n = Path('i18n.py').read_text(encoding='utf-8')
          doc = Path('GROUP_3_3_CANONICAL_UI.md').read_text(encoding='utf-8')
          assert 'DEFAULT_MAX_WIDTH = 40' in term
          assert 'def render_terminal_box(content: str, max_width: int = DEFAULT_MAX_WIDTH)' in term
          assert 'nav:home' in term and 'screen:account' in term
          assert 't(_lang(update), "loading")' in main
          assert 'show_alert=False' in main
          assert '"loading":"Loading..."' in i18n
          assert '"loading":"Memuat..."' in i18n
          assert 'Active state' in doc and 'Inactive state' in doc
          ast.parse(main)
          ast.parse(term)
          print('GROUP 3.3 FINAL CONTRACT AUDIT: PASS')
          PY
      - name: Commit Group 3.3 canonical UI
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ "$GITHUB_REF" != "refs/heads/main" ]; then exit 0; fi
          if [ "$(git log -1 --pretty=%s)" = "Group 3.3: finalize canonical UI" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py i18n.py tests/test_ui_regressions.py
          if git diff --cached --quiet; then
            echo 'No Group 3.3 source changes required.'
          else
            git commit -m 'Group 3.3: finalize canonical UI'
            git push origin main
          fi
