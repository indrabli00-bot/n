name: Phase 2 CI

on:
  push:
    branches: ["main", "phase2-fix"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

env:
  TELEGRAM_BOT_TOKEN: "123456:TEST_TOKEN"
  GOLDAPI_API_KEY: "test-goldapi-key"
  DATABASE_URL: "sqlite:///xauusd_bot_ci.db"
  WHOP_WEBHOOK_SECRET: "whsec_cGhhc2UyLXRlc3Qtc2VjcmV0"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Apply Group 3.3 canonical refactor
        run: |
          if git log -1 --pretty=%B | grep -q 'Group 3.3: canonical terminal rendering'; then
            echo 'Canonical refactor already applied; validation only.'
          else
            python scripts/refactor_group33.py
          fi
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Static UI hardcode guard
        run: python scripts/check_ui_hardcoded_strings.py
      - name: Pytest
        run: |
          python -m pip install pytest
          python -m pytest -q
      - name: Full unittest regression
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Commit Group 3.3 code changes
        run: |
          if git diff --quiet -- main.py terminal_style.py tests/test_terminal_style.py tests/test_group33_navigation.py tests/test_ui_regressions.py tests/test_ui_language_consistency.py; then
            echo 'No code changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py terminal_style.py tests/test_terminal_style.py tests/test_group33_navigation.py tests/test_ui_regressions.py tests/test_ui_language_consistency.py
          git commit -m 'Group 3.3: canonical terminal rendering and navigation'
          git push origin main
