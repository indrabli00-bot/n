name: Phase 2 CI

on:
  push:
    branches: ["main", "phase2-fix"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, 'Group 3.3: canonical terminal rendering') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Apply Group 3.3 canonical refactor
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from textwrap import dedent

          terminal = dedent('''
          """NEURAL GOLD v3.2 — terminal UI helpers."""
          from __future__ import annotations
          from datetime import datetime, timezone
          from typing import Iterable
          from config import NEURAL_VERSION
          from i18n import t

          def stamp() -> str:
              return datetime.now(timezone.utc).strftime("[ %Y-%m-%d %H:%M:%S UTC ]")

          def line(tag: str, msg: str) -> str:
              return f"[ {tag} ]: {msg}"

          def word_wrap(text: str, max_width: int) -> list[str]:
              if max_width <= 0:
                  raise ValueError("max_width must be positive")
              if len(text) <= max_width:
                  return [text]
              words = text.split()
              lines: list[str] = []
              current = ""
              for word in words:
                  if len(word) > max_width:
                      if current:
                          lines.append(current.rstrip())
                          current = ""
                      for i in range(0, len(word), max_width):
                          lines.append(word[i:i + max_width])
                      continue
                  candidate = f"{current} {word}" if current else word
                  if len(candidate) <= max_width:
                      current = candidate
                  else:
                      if current:
                          lines.append(current.rstrip())
                      current = word
              if current:
                  lines.append(current.rstrip())
              return lines or [""]

          def render_header(user, lang: str) -> str:
              import auth
              operator_name = user.first_name or "OPERATOR"
              active, _ = auth.verify_token(user.id)
              status_text = t(lang, "active") + " 🟢" if active else t(lang, "inactive") + " 🔴"
              return f"{stamp()}\\nOPERATOR : {operator_name}\\nSTATUS   : {status_text}\\n"

          def render_terminal_box(content: str, max_width: int | None = None) -> str:
              """Return preformatted content with no decorative border or fixed panel width."""
              if max_width is None:
                  return content.strip("\\n")
              return "\\n".join(
                  part for raw_line in content.split("\\n")
                  for part in word_wrap(raw_line, max_width)
              )

          def render_persistent_nav(lang: str):
              from telegram import InlineKeyboardButton, InlineKeyboardMarkup
              return InlineKeyboardMarkup([[
                  InlineKeyboardButton(f"🏠 {t(lang, 'menu')}", callback_data="nav:home"),
                  InlineKeyboardButton(f"👨‍💼 {t(lang, 'account')}", callback_data="screen:account"),
              ]])

          def panel(rows: Iterable[str], escape: bool = False) -> str:
              if escape:
                  import html as _html
                  rows = [_html.escape(str(r)) for r in rows]
              return "\\n".join(str(r) for r in rows)

          def prow(text: str, max_width: int | None = None) -> str:
              s = str(text)
              return s if max_width is None else s[:max_width]

          def bar(ch: str = "─", max_width: int | None = None) -> str:
              return "" if max_width is None else ch * max_width

          def boot(granted: bool) -> str:
              seq = [
                  line("SYSTEM", f"INITIALIZING NEURAL GOLD {NEURAL_VERSION}..."),
                  line("STATUS", "SYNCING GLOBAL BULLION RESERVES..."),
                  line("ACCESS", "GRANTED. WELCOME, OPERATOR.") if granted else line("ACCESS", "PENDING // CLEARANCE REQUIRED"),
              ]
              return "\\n".join(seq)

          def intel_header() -> str:
              return "[ !!! INTELLIGENCE REPORT : XAUUSD !!! ]"

          def intel_footer() -> str:
              return line("SECURITY", "Restricted Data. For Operator Eyes Only.")

          def data_gap(hint: str | None = None) -> str:
              text = line("ERROR", "DATA_GAP_DETECTED")
              return f"{text}\\n{hint}" if hint else text

          def link_timeout(hint: str | None = None) -> str:
              text = line("FAULT", "LINK_TIMEOUT // RETRYING...")
              return f"{text}\\n{hint}" if hint else text

          def _guide(lang: str, keys: tuple[str, ...], tag: str) -> str:
              body = "\\n".join(f"{i}. {t(lang, key)}" for i, key in enumerate(keys, 1))
              return f"{line(tag, t(lang, 'select_plan'))}\\n{body}"

          def buy_guide(lang: str, tag: str = "PAYMENT") -> str:
              return _guide(lang, ("select_plan", "use_package_buttons", "paid"), tag)

          def pay_guide(lang: str, tag: str = "PAYMENT") -> str:
              return _guide(lang, ("select_plan", "use_package_buttons", "paid", "verified_auto", "activate"), tag)
          ''').lstrip()
          Path('terminal_style.py').write_text(terminal, encoding='utf-8')

          p = Path('main.py')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'\ndef _nav_keyboard\(.*?\n(?=def |async def )', '\n', s, flags=re.S)
          s = re.sub(
              r'def _persistent_nav\(update: Update\) -> list\[InlineKeyboardButton\]:.*?\n\n\ndef _keyboard',
              dedent('''
              def _persistent_nav(update: Update) -> list[InlineKeyboardButton]:
                  lang = _lang(update)
                  return list(ts.render_persistent_nav(lang).inline_keyboard[0])


              def _keyboard''').strip(),
              s,
              flags=re.S,
          )
          s = s.replace("InlineKeyboardButton(t(lang, 'back'), callback_data='nav:home')", "")
          s = s.replace("await _present(update, text, InlineKeyboardMarkup(rows))", "await _present(update, text, _keyboard(update, rows))")
          s = s.replace("await _present(update, text, _nav_keyboard(update))", "await _present(update, text, _keyboard(update))")
          s = s.replace("from terminal_style import boot, intel_footer, intel_header, pay_guide, panel, stamp", "from terminal_style import boot, intel_footer, intel_header, pay_guide, panel, render_header, render_terminal_box, stamp")

          marker = 'async def _present(update: Update, text: str, keyboard: InlineKeyboardMarkup, edit: bool=True) -> None:'
          start = s.index(marker)
          end = s.index('\\nasync def start_command', start)
          present = dedent('''
          async def _present(update: Update, text: str, keyboard: InlineKeyboardMarkup, edit: bool=True) -> None:
              """Enforce Header -> Terminal -> optional Action, with keyboard navigation."""
              query = update.callback_query
              user = update.effective_user
              lang = _lang(update)
              body = re.sub(r"<[^>]+>", "", text)
              body = html.unescape(body).strip()
              # Decorative box glyphs belong to the retired fixed-width frame.
              body = body.translate(str.maketrans('', '', '┍┑┕┙│◤◥◣◢━─'))
              canonical = f"{render_header(user, lang)}\\n<pre>{render_terminal_box(body)}</pre>" if user else f"<pre>{render_terminal_box(body)}</pre>"
              if query and edit:
                  try:
                      await query.edit_message_text(text=canonical, parse_mode='HTML', reply_markup=keyboard)
                      return
                  except BadRequest as exc:
                      if 'not modified' in str(exc).lower():
                          return
                      logger.debug('Could not edit callback message: %s', exc)
                  except Exception as exc:
                      logger.debug('Could not edit callback message: %s', exc)
              try:
                  if query and query.message:
                      await query.message.reply_text(canonical, parse_mode='HTML', reply_markup=keyboard)
                      return
              except Exception as exc:
                  logger.debug('Callback reply fallback failed: %s', exc)
              if update.message:
                  await update.message.reply_text(canonical, parse_mode='HTML', reply_markup=keyboard)
          ''').lstrip()
          s = s[:start] + present + s[end:]
          p.write_text(s, encoding='utf-8')

          Path('tests/test_terminal_style.py').write_text(dedent('''
          import os, sys, unittest
          sys.path.insert(0, os.path.dirname(os.path.dirname(os.path.abspath(__file__))))
          os.environ.setdefault("DATABASE_URL", "sqlite:///:memory:")
          os.environ.setdefault("TELEGRAM_BOT_TOKEN", "123456:TEST")
          os.environ.setdefault("GOLDAPI_API_KEY", "phase0-test-goldapi-key")
          os.environ.setdefault("WHOP_WEBHOOK_SECRET", "whsec_phase2-test-secret")
          import i18n
          import terminal_style as ts

          class TerminalStyleTests(unittest.TestCase):
              def test_boot_sequence_matches_spec_a(self):
                  self.assertIn("[ SYSTEM ]: INITIALIZING NEURAL GOLD", ts.boot(True))
                  self.assertIn("[ ACCESS ]: GRANTED. WELCOME, OPERATOR.", ts.boot(True))
                  self.assertIn("[ ACCESS ]: PENDING // CLEARANCE REQUIRED", ts.boot(False))
              def test_intel_report_frame_matches_spec_c(self):
                  self.assertEqual(ts.intel_header(), "[ !!! INTELLIGENCE REPORT : XAUUSD !!! ]")
                  self.assertIn("Restricted Data. For Operator Eyes Only.", ts.intel_footer())
              def test_error_codes_match_spec_d(self):
                  self.assertIn("[ ERROR ]: DATA_GAP_DETECTED", ts.data_gap())
                  self.assertIn("[ FAULT ]: LINK_TIMEOUT // RETRYING...", ts.link_timeout())
              def test_terminal_has_no_decorative_border(self):
                  content = "[ SYSTEM ]: TEST"
                  box = ts.render_terminal_box(content)
                  self.assertEqual(box, content)
                  self.assertNotIn("┍", box)
                  self.assertNotIn("┙", box)
                  self.assertNotIn("│", box)
              def test_word_wrap_explicit_max_width(self):
                  result = ts.word_wrap("A" * 40, 34)
                  self.assertEqual([len(x) for x in result], [34, 6])
                  self.assertEqual("".join(result), "A" * 40)
              def test_terminal_wrap_respects_explicit_max_width(self):
                  self.assertEqual([len(x) for x in ts.render_terminal_box("A" * 40, 34).splitlines()], [34, 6])
              def test_unicode_character_count(self):
                  self.assertEqual(len("🟢"), 1)
                  self.assertEqual(len("中文"), 2)
              def test_pay_guide_localized_for_all_languages(self):
                  for lang in ("en", "vi", "hi", "id", "zh"):
                      for key in ("select_plan", "use_package_buttons", "paid", "verified_auto", "activate"):
                          self.assertIn(i18n.t(lang, key), ts.pay_guide(lang))
              def test_stamp_shape(self):
                  self.assertTrue(ts.stamp().startswith("[ ") and ts.stamp().endswith(" UTC ]"))
          if __name__ == "__main__": unittest.main()
          ''').lstrip(), encoding='utf-8')

          n = Path('tests/test_group33_navigation.py').read_text(encoding='utf-8')
          n = re.sub(r'    def test_canonical_box_has_fixed_geometry\(self\):.*?\n    def test_long_token_is_fully_preserved', dedent('''
              def test_terminal_box_has_no_fixed_geometry(self):
                  box = ts.render_terminal_box("A" * 40)
                  self.assertEqual(box, "A" * 40)
                  self.assertNotIn("┍", box)
                  self.assertNotIn("│", box)

              def test_long_token_is_fully_preserved''').lstrip(), n, flags=re.S)
          Path('tests/test_group33_navigation.py').write_text(n, encoding='utf-8')
          PY
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Static UI hardcode guard
        run: python scripts/check_ui_hardcoded_strings.py
      - name: Pytest
        run: |
          python -m pip install pytest
          python -m pytest -q
      - name: Run Phase 2 tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Commit Group 3.3 code changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py terminal_style.py tests/test_terminal_style.py tests/test_group33_navigation.py
          git commit -m 'Group 3.3: canonical terminal rendering and navigation'
          git push origin main
