name: Group 3.3 canonical migration
on:
  push:
    branches: [main]
permissions:
  contents: write
env:
  TELEGRAM_BOT_TOKEN: "123456:TEST_TOKEN"
  GOLDAPI_API_KEY: "test-goldapi-key"
  DATABASE_URL: "sqlite:///:memory:"
  WHOP_WEBHOOK_SECRET: "whsec_cGhhc2UyLXRlc3Qtc2VjcmV0"
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Apply canonical implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p = Path('main.py')
          s = p.read_text(encoding='utf-8')
          if 'import asyncio\n' not in s:
              s = s.replace('import html\n', 'import asyncio\nimport html\n', 1)
          s = s.replace('await api_handler.get_cached_or_fresh_price(user.id)', 'await asyncio.wait_for(api_handler.get_cached_or_fresh_price(user.id), timeout=10.0)')
          start = s.find('async def _present(')
          end = s.find('async def start_command', start)
          if start < 0 or end < 0:
              raise SystemExit(f'_present boundaries missing: {start}, {end}')
          present = base64.b64decode('').decode()
          s = s[:start] + present + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Compile
        run: python -m compileall -q .
      - name: Static UI guard
        run: python scripts/check_ui_hardcoded_strings.py
      - name: Pytest
        run: python -m pytest -q
      - name: Full unittest
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Contract source audit
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('main.py').read_text(encoding='utf-8')
          assert '_nav_keyboard' not in s
          assert 'nav:back' not in s
          assert 'timeout=10.0' in s
          t = Path('terminal_style.py').read_text(encoding='utf-8')
          assert 'DEFAULT_MAX_WIDTH = 40' in t
          assert 'def render_terminal_box(content: str, max_width: int = DEFAULT_MAX_WIDTH)' in t
          pv = Path('premium_visuals.py').read_text(encoding='utf-8')
          assert 'main.render_' not in pv
          print('GROUP 3.3 CONTRACT AUDIT: PASS')
          PY
      - name: Commit canonical implementation and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py tests/test_ui_regressions.py
          git rm .github/workflows/group33-canonicalize-once.yml
          git commit -m 'Group 3.3: finalize canonical UI implementation'
          git push origin main
