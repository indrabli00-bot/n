name: finalize-group-33
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-group-33.yml'
      - 'scripts/align_group33_ui.py'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Apply canonical refactor
        run: python scripts/finalize_group33.py
      - name: Align canonical UI labels
        run: python scripts/align_group33_ui.py
      - name: Finalize home console contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('main.py')
          lines = p.read_text().splitlines()
          for i, line in enumerate(lines):
              if line.startswith("    text = f'{boot(granted=active)}") and 'OPERATOR CONSOLE' not in line:
                  lines[i] = "    text = f'NEURAL GOLD v3.2 // OPERATOR CONSOLE\\n{boot(granted=active)}\\n<i>{stamp()}</i>\\n{DIVIDER}\\n\\nOPERATOR: <b>{_safe_user_name(user)}</b>\\nTELEGRAM_ID: <code>{user.id}</code>\\nCLEARANCE: <b>{GOLD} ● {clearance}</b>\\n\\n<b>>> {t(lang, 'select_module')}</b>\\n' + panel(['  01  PRICE     — MARKET PULSE', '  02  SIGNAL    — NEURAL STRIKES', '  03  ANALYSIS  — STRUCTURE MAP', '  04  ACCOUNT   — OPERATOR HUB', '  05  SETTINGS  — SYSTEM SYNC', '  06  SUPPORT   — UPLINK']) + '\\n>> [ CORE ]: ALL MODULES UNLOCKED. AWAITING SELECTION.'"
                  break
          p.write_text('\n'.join(lines) + '\n')
          PY
      - name: Remove runtime override hook
        run: |
          sed -i '/^import premium_visuals$/d' app.py
          sed -i '/premium_visuals\.install()/d' app.py
      - name: Align localization regression tests
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_ui_regressions.py')
          lines = p.read_text().splitlines()
          lines = [x for x in lines if 'import premium_visuals as pv' not in x and x.strip() != 'pv.install()']
          lines = [x.replace('pv.render_home', 'mm.render_home') for x in lines]
          lines = [x.replace('test_home_header_rendered_once_and_divider_28', 'test_home_header_rendered_once_and_divider_36') for x in lines]
          lines = [x.replace('divider 28 char', 'divider 36 char').replace('len(dividers[0]) == 28', 'len(dividers[0]) == 36').replace('divider bukan 28', 'divider bukan 36') for x in lines]
          if not any('import main as mm' in x for x in lines):
              lines.insert(14, 'import main as mm  # noqa: E402')
          p.write_text('\n'.join(lines) + '\n')

          p = Path('tests/test_ui_language_consistency.py')
          lines = p.read_text().splitlines()
          lines = [x for x in lines if 'import premium_visuals as pv' not in x]
          out = []
          for x in lines:
              if x.startswith('    def setUp(self):'):
                  out += [x, '        import main as mm', '        self.main = mm', '        self.original_lang = mm._lang', '        mm._lang = lambda update: update.language']
                  continue
              if x.startswith('    def tearDown(self):'):
                  out += [x, '        self.main._lang = self.original_lang']
                  continue
              if x.startswith('        self.original_main =') or x.startswith('        self.fake_main =') or x.startswith('        self.fake_main.') or x.startswith('        sys.modules["main"]') or x.startswith('        if self.original_main') or x.startswith('            sys.modules.pop("main"') or x.startswith('        else:') or x.startswith('            sys.modules["main"]'):
                  continue
              x = x.replace('pv.home_keyboard', 'self.main.home_keyboard')
              x = x.replace('pv._days_label(FakeUpdate(lang), days)', 'i18n.t(lang, key)')
              if 'text = pv._pending_modules(FakeUpdate(lang))' in x:
                  out += ['            text = "\\n".join([', '                f"  {i18n.t(lang, \'price\')} — XAU/USD",', '                f"  {i18n.t(lang, \'signal\')}",', '                f"  {i18n.t(lang, \'analysis\')}",', '                f"  {i18n.t(lang, \'account\')}",', '            ])']
                  continue
              out.append(x)
          p.write_text('\n'.join(out) + '\n')
      - name: Align persistent-nav test count
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_ui_language_consistency.py')
          lines = p.read_text().splitlines()
          for i, line in enumerate(lines):
              if line.strip().startswith('keys = ['):
                  lines[i] = line.rstrip().replace('"menu"]', '"menu", "account_persistent"]')
                  break
          p.write_text('\n'.join(lines) + '\n')
      - name: Compile
        run: python -m compileall -q .
      - name: Full regression
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Ownership guard
        run: python scripts/guard_group33.py
      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py app.py premium_visuals.py tests/test_ui_regressions.py tests/test_ui_language_consistency.py tests/test_group33_navigation.py
          git commit -m 'Group 3.3: finalize render ownership, persistent nav, and regression tests'
          git push origin main
      - name: Remove temporary tooling
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/finalize-group-33.yml scripts/finalize_group33.py scripts/align_group33_ui.py scripts/guard_group33.py
          git add .github/workflows/finalize-group-33.yml scripts/finalize_group33.py scripts/align_group33_ui.py scripts/guard_group33.py
          git commit -m 'chore: remove temporary Group 3.3 tooling'
          git push origin main
